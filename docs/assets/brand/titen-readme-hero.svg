  </g>
  <text x="124" y="67" fill="#8A7F72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2.2">OPEN-SOURCE AGENT MEMORY · NO API KEY</text>

  <text x="60" y="242" fill="#F7F2E9" font-family="Arial, Helvetica, sans-serif" font-size="118" font-weight="700">titen</text>
  <text x="65" y="290" fill="#C9BCA6" font-family="Arial, Helvetica, sans-serif" font-size="25">no API key, no LLM, no embedding provider</text>
  <text x="65" y="334" fill="#8A7F72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing=".6">EVIDENCE-GROUNDED CONTEXT · COORDINATED WORK</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#C9BCA6">
