<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Titen, agent memory that runs with no API key, no LLM, and no embedding provider</title>
  <desc id="desc">An ink banner with the Titen Kawung mark, the no-key positioning, and runtime targets.</desc>

  <defs>
    <g id="kawung">
      <ellipse cx="50" cy="25" rx="15" ry="25" fill="#F7F2E9" stroke="#171310" stroke-width="2.4"/>
      <ellipse cx="50" cy="75" rx="15" ry="25" fill="#F7F2E9" stroke="#171310" stroke-width="2.4"/>
      <ellipse cx="25" cy="50" rx="25" ry="15" fill="#C97A44" stroke="#171310" stroke-width="2.4"/>
      <ellipse cx="75" cy="50" rx="25" ry="15" fill="#C97A44" stroke="#171310" stroke-width="2.4"/>
      <circle cx="50" cy="50" r="8.5" fill="#171310"/>
      <circle cx="50" cy="50" r="4.6" fill="#F7F2E9"/>
    </g>
  </defs>

  <rect width="1200" height="460" rx="20" fill="#171310"/>
  <path d="M0 92H1200M0 368H1200" stroke="#3E3630"/>

  <g opacity=".12" transform="translate(785 -48) scale(4.9)">
