name: Feature request
description: Propose a concrete Titen capability or improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the real workflow or limitation, not only a preferred implementation.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Product mode
      options:
        - Personal
        - Company
        - Enterprise
        - All modes
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current workaround
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and scale
      description: Include frequency, corpus size, latency, cost, or failure examples when available.
  - type: dropdown
    id: complexity
    attributes:
      label: Work classification
      description: When unsure, select complex.
      options:
        - Complex — durable EARS spec and plan required
        - Simple — inline spec and plan allowed
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: EARS acceptance criteria
      description: Use one observable behavior per criterion. Complex work will move these into a durable work spec.
      placeholder: |
        AC-EXAMPLE-001 — When <event>, Titen shall <measurable response>.
        AC-EXAMPLE-002 — If <failure>, then Titen shall <safe observable response>.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This belongs in a memory/collaboration layer rather than an agent runtime or general scheduler.
          required: true
