name: CI

# Tests only. Releases stay manual from a maintainer's machine and are never
# published by this workflow: see docs/engineering/release.md. No secrets are
# consumed here, so a fork pull request runs the same gates as a branch.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: pnpm install --frozen-lockfile

      - name: Workflow and ponytail ledger checks
        run: pnpm check:workflow

      - name: Contract suite, both runtimes
        run: pnpm test:api

      - name: Integration suite
        run: pnpm test:integration

      - name: Dashboard bundle budget
        run: pnpm build
